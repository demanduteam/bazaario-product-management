                    )}

                    <ConnectProductModal 
                        isOpen={!!selectedItemForModal} 
                        onClose={() => setSelectedItemForModal(null)} 
                        item={selectedItemForModal} 
                        allProducts={allProducts} 
                        allBrands={allBrands}
                        categories={categories}
                        targetStatusId={targetStatusId}
                        onConnected={() => {
                            setSelectedItemForModal(null);
                            fetchPendingItems(true); 
                        }}
                    />
                </div>
            );
        };

        const ProductForm = ({ isOpen, onClose, onSave, product, appData }) => {
            const { categories, brands } = appData;
            const initialFormData = { title: '', productcategoryid: '', brandid: '', image_url: '' };
            const [formData, setFormData] = React.useState(initialFormData);
            const [properties, setProperties] = React.useState([]);
            const [propertyValues, setPropertyValues] = React.useState({});
            const [imageFile, setImageFile] = React.useState(null);
            const [imagePreview, setImagePreview] = React.useState(null);
            const [isLoading, setIsLoading] = React.useState(false);
            const [error, setError] = React.useState('');

            React.useEffect(() => {
                if (isOpen) {
                    setError('');
                    setProperties([]);
                    setPropertyValues({});
                    setImageFile(null);
                    setImagePreview(null);
                    if (product) {
                        setFormData({
                            title: product.title || '',
                            productcategoryid: product.productcategoryid || '',
                            brandid: product.brandid || '',
                            image_url: product.image_url || ''
                        });
                        if (product.image_url) {
                            setImagePreview(product.image_url);
                        }
                        if(product.productcategoryid) {
                            fetchCategoryProperties(product.productcategoryid);
                        }
                        fetchProductProperties(product.id);
                    } else {
                        setFormData(initialFormData);
                    }
                }
            }, [product, isOpen]);

            const fetchCategoryProperties = async (categoryId) => {
                const { data, error } = await supabaseClient
                    .from('category_propertykey')
                    .select('propertykey(id, title)')
                    .eq('category_id', categoryId);
                if (error) console.error("Error fetching category properties:", error);
                else setProperties(data.map(item => item.propertykey));
            };
            
            const fetchProductProperties = async (productId) => {
                const { data, error } = await supabaseClient
                    .from('productproperty')
                    .select('propertykeyid, value')
                    .eq('productid', productId);
                if(error) console.error("Error fetching product properties:", error);
                else {
                    const values = data.reduce((acc, curr) => {
                        acc[curr.propertykeyid] = curr.value;
                        return acc;
                    }, {});
                    setPropertyValues(values);
                }
            };

            const handleCategoryChange = (categoryId) => {
                setFormData(prev => ({ ...prev, productcategoryid: categoryId }));
                setPropertyValues({});
                if (categoryId) {
                    fetchCategoryProperties(categoryId);
                } else {
                    setProperties([]);
                }
            };
            
            const handlePropertyChange = (propertyKeyId, value) => {
                setPropertyValues(prev => ({...prev, [propertyKeyId]: value}));
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setImageFile(file);
                    setImagePreview(URL.createObjectURL(file));
                }
            };

            const uploadImage = async (file) => {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
                const filePath = `${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('product-images')
                    .upload(filePath, file);

                if (uploadError) throw uploadError;

                const { data: { publicUrl } } = supabaseClient.storage
                    .from('product-images')
                    .getPublicUrl(filePath);

                return publicUrl;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.title || !formData.productcategoryid) {
                    setError('نام محصول و دسته‌بندی اجباری است.');
                    return;
                }
                setIsLoading(true);
                setError('');
                
                try {
                    let imageUrl = formData.image_url;

                    if (imageFile) {
                        imageUrl = await uploadImage(imageFile);
                    }

                    const productData = {
                        title: formData.title,
                        productcategoryid: formData.productcategoryid,
                        brandid: formData.brandid || null,
                        image_url: imageUrl
                    };

                    let productId;
                    if (product) { 
                        const { data, error } = await supabaseClient.from('product').update(productData).eq('id', product.id).select().single();
                        if (error) throw error;
                        productId = data.id;
                    } else { 
                        const { data, error } = await supabaseClient.from('product').insert(productData).select().single();
                        if (error) throw error;
                        productId = data.id;
                    }
                    
                    if (productId) {
                        await supabaseClient.from('productproperty').delete().eq('productid', productId);

                        const propertiesToInsert = Object.entries(propertyValues)
                            .filter(([key, value]) => value)
                            .map(([propertyKeyId, value]) => ({
                                productid: productId,
                                propertykeyid: parseInt(propertyKeyId),
                                value: value
                            }));
                        
                        if (propertiesToInsert.length > 0) {
                            const { error: insertError } = await supabaseClient.from('productproperty').insert(propertiesToInsert);
                            if (insertError) throw insertError;
                        }
                    }
                    
                    onSave();
                    onClose();
                } catch (err) {
                    console.error("Product save error:", err);
                    setError(err.message || "خطا در ذخیره محصول.");
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={product ? 'ویرایش محصول' : 'افزودن محصول جدید'}>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="flex flex-col items-center mb-4">
                            <label className="block w-full text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">تصویر محصول</label>
                            <div className="w-full flex items-center gap-4">
                                <div className="h-24 w-24 bg-gray-200 dark:bg-gray-700 rounded-lg overflow-hidden flex items-center justify-center border border-gray-300 dark:border-gray-600">
                                    {imagePreview ? (
                                        <img src={imagePreview} alt="Preview" className="h-full w-full object-cover" />
                                    ) : (
                                        <span className="text-gray-400 text-xs text-center px-1">بدون تصویر</span>
                                    )}
                                </div>
                                <div className="flex-1">
                                    <input 
                                        type="file" 
                                        accept="image/*"
                                        onChange={handleImageChange}
                                        className="w-full text-sm text-gray-500
                                        file:mr-4 file:py-2 file:px-4
                                        file:rounded-full file:border-0
                                        file:text-sm file:font-semibold
                                        file:bg-indigo-50 file:text-indigo-700
                                        hover:file:bg-indigo-100 dark:file:bg-gray-700 dark:file:text-indigo-300"
                                    />
                                    <p className="text-xs text-gray-500 mt-1">فرمت‌های مجاز: JPG, PNG. حداکثر 100 KB.</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">نام محصول</label>
                            <input type="text" name="title" value={formData.title} onChange={handleChange} className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">دسته‌بندی</label>
                                <SearchableSelect
                                    options={categories}
                                    value={formData.productcategoryid}
                                    onChange={handleCategoryChange}
                                    placeholder="جستجو یا انتخاب دسته‌بندی..."
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">برند (اختیاری)</label>
                                 <SearchableSelect
                                    options={brands}
                                    value={formData.brandid}
                                    onChange={(selectedBrandId) => handleChange({ target: { name: 'brandid', value: selectedBrandId }})}
                                    placeholder="جستجو یا انتخاب برند..."
                                />
                            </div>
                        </div>
                        
                        {properties.length > 0 && (
                            <div className="border-t border-gray-200 dark:border-gray-700 pt-4 mt-4">
                                <h3 className="text-lg font-semibold mb-2">ویژگی‌های محصول</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {properties.map(prop => (
                                        <div key={prop.id}>
                                            <label className="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">{prop.title}</label>
                                            <input
                                                type="text"
                                                value={propertyValues[prop.id] || ''}
                                                onChange={(e) => handlePropertyChange(prop.id, e.target.value)}
                                                className="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {error && <p className="text-red-500 text-sm mt-2 p-2 bg-red-100 dark:bg-red-900/50 rounded-md">{error}</p>}
                        <div className="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-600">
                            <button type="button" onClick={onClose} className="w-full sm:w-auto bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-800 dark:text-white py-2 px-4 rounded-lg">لغو</button>
                            <button type="submit" disabled={isLoading} className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg disabled:bg-indigo-400 flex justify-center items-center">
                                {isLoading ? <div className="spinner !border-t-white"></div> : (product ? 'به‌روزرسانی محصول' : 'ایجاد محصول')}
                            </button>
                        </div>
                    </form>
                </Modal>
            );
        };
        
        const ProductDetailsModal = ({ isOpen, onClose, product, onSave }) => {
            const [localSuppliers, setLocalSuppliers] = React.useState([]);
            const [showAddForm, setShowAddForm] = React.useState(false);
            
            const [locationOptions, setLocationOptions] = React.useState([]);
            const [stockForm, setStockForm] = React.useState({ compositeId: '', unitprice: '', quantity: '' });
            const [isSubmittingStock, setIsSubmittingStock] = React.useState(false);
            const [stockError, setStockError] = React.useState('');
            const [isUpdatingRow, setIsUpdatingRow] = React.useState(null);

            React.useEffect(() => {
                if (isOpen && product) {
                    const initialSuppliers = (product.supplierstock || []).map(s => ({...s, isDirty: false}));
                    setLocalSuppliers(initialSuppliers);
                    setShowAddForm(false);
                    setStockError('');
                    setStockForm({ compositeId: '', unitprice: '', quantity: '' });
                }
            }, [isOpen, product]);

            React.useEffect(() => {
                if (isOpen && showAddForm && locationOptions.length === 0) {
                    const fetchLocations = async () => {
                        try {
                            const roleRes = await supabaseClient.from('role').select('id').eq('title', 'Supplier').single();
                            if (roleRes.error) throw roleRes.error;
                            const supplierRoleId = roleRes.data.id;

                            const { data, error } = await supabaseClient
                                .from('userlocation')
                                .select('location!inner(id), profiles!inner(id, roleid)')
                                .eq('profiles.roleid', supplierRoleId);
                            
                            if (error) throw error;

                            const options = data.map(ul => ({
                                id: `${ul.location.id}|${ul.profiles.id}`,
                                title: `انبار (کد: ${ul.location.id})`
                            }));
                            
                            const uniqueOptions = [];
                            const seen = new Set();
                            for(const opt of options) {
                                if(!seen.has(opt.id)) {
                                    seen.add(opt.id);
                                    uniqueOptions.push(opt);
                                }
                            }
                            setLocationOptions(uniqueOptions);
                        } catch (err) {
                            console.error("Error fetching locations:", err);
                        }
                    };
                    fetchLocations();
                }
            }, [isOpen, showAddForm]);

            const handleAddStock = async (e) => {
                e.preventDefault();
                if (!stockForm.compositeId) {
                    setStockError("لطفاً یک انبار را انتخاب کنید.");
                    return;
                }
                
                setIsSubmittingStock(true);
                setStockError('');
                
                const [location_id, supplieruserid] = stockForm.compositeId.split('|');

                try {
                    const { data, error } = await supabaseClient.from('supplierstock').insert({
                        productid: product.id,
                        location_id: parseInt(location_id),
                        supplieruserid: supplieruserid,
                        unitprice: stockForm.unitprice ? Number(stockForm.unitprice) : null,
                        quantity: stockForm.quantity ? Number(stockForm.quantity) : null,
                        is_available: true
                    }).select('*, location(id), profiles:supplieruserid(fullname)').single();

                    if (error) {
                        if (error.code === '23505') {
                            throw new Error("این محصول از قبل در انبار انتخابی وجود دارد. لطفاً از لیست پایین برای ویرایش استفاده کنید.");
                        }
                        throw error;
                    }

                    const newStock = { ...data, isDirty: false };
                    setLocalSuppliers([newStock, ...localSuppliers]);
                    setShowAddForm(false);
                    setStockForm({ compositeId: '', unitprice: '', quantity: '' });
                    
                    if (onSave) onSave();
                    
                } catch (err) {
                    setStockError(err.message || 'خطا در ثبت موجودی جدید.');
                } finally {
                    setIsSubmittingStock(false);
                }
            };

            const handleStockChange = (index, field, value) => {
                const newSuppliers = [...localSuppliers];
                newSuppliers[index][field] = value === '' ? null : Number(value);
                newSuppliers[index].isDirty = true;
                setLocalSuppliers(newSuppliers);
            };

            const handleUpdateStock = async (index) => {
                const stock = localSuppliers[index];
                setIsUpdatingRow(index);
                try {
                    const locId = stock.location_id || stock.location?.id || stock.locationid;
                    const { error } = await supabaseClient.from('supplierstock')
                        .update({
                            unitprice: stock.unitprice,
                            quantity: stock.quantity
                        })
                        .eq('location_id', locId)
                        .eq('productid', product.id);

                    if (error) throw error;
                    
                    const newSuppliers = [...localSuppliers];
                    newSuppliers[index].isDirty = false;
                    setLocalSuppliers(newSuppliers);
                    if(onSave) onSave();
                } catch (err) {
                    console.error("Update error:", err);
                    alert('خطا در بروزرسانی: ' + err.message);
                } finally {
                    setIsUpdatingRow(null);
                }
            };

            if (!isOpen || !product) return null;
            const properties = product.productproperty || [];

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`جزئیات محصول: ${product.title}`}>
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row gap-6">
                            <div className="w-full md:w-1/3 flex justify-center">
                                <div className="w-full max-w-[200px] aspect-square rounded-xl bg-white dark:bg-gray-800 p-2 border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden">
                                    {product.image_url ? (
                                        <img src={product.image_url} alt={product.title} className="w-full h-full object-contain" />
                                    ) : (
                                        <div className="text-gray-400 text-4xl">📷</div>
                                    )}
                                </div>
                            </div>

                            <div className="w-full md:w-2/3">
                                <div className="p-4 bg-gray-100 dark:bg-gray-700/50 rounded-lg grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <h4 className="text-xs text-gray-500 dark:text-gray-400">نام محصول</h4>
                                        <p className="font-semibold">{product.title}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-xs text-gray-500 dark:text-gray-400">شناسه (ID)</h4>
                                        <p className="font-mono">{product.id}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-xs text-gray-500 dark:text-gray-400">برند</h4>
                                        <p className="font-semibold">{product.brand?.title || '-'}</p>
                                    </div>
                                    <div>
                                        <h4 className="text-xs text-gray-500 dark:text-gray-400">دسته‌بندی</h4>
                                        <p className="font-semibold">{product.productcategory?.title || '-'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {properties.length > 0 && (
                            <div>
                                <h3 className="text-lg font-semibold mb-2">ویژگی‌ها</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2 p-4 bg-gray-50 dark:bg-gray-700/30 rounded-lg">
                                    {properties.map(prop => prop.propertykey && (
                                        <div key={prop.propertykey.id} className="flex justify-between border-b border-gray-200 dark:border-gray-600 py-1">
                                            <span className="text-gray-600 dark:text-gray-400">{prop.propertykey.title}:</span>
                                            <span className="font-semibold">{prop.value}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div>
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-lg font-semibold">موجودی تامین‌کنندگان</h3>
                                <button 
                                    onClick={() => { setShowAddForm(!showAddForm); setStockError(''); }} 
                                    className={`text-sm font-semibold px-3 py-1.5 rounded-lg transition-colors ${showAddForm ? 'bg-gray-200 text-gray-700 dark:bg-gray-600 dark:text-gray-200' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200 dark:bg-indigo-900/40 dark:text-indigo-300 dark:hover:bg-indigo-800/60'}`}
                                >
                                    {showAddForm ? 'انصراف' : '➕ تخصیص به انبار'}
                                </button>
                            </div>

                            {showAddForm && (
                                <form onSubmit={handleAddStock} className="bg-indigo-50 dark:bg-indigo-900/20 p-4 rounded-xl mb-4 border border-indigo-100 dark:border-indigo-800">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div className="sm:col-span-3">
                                            <label className="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">انتخاب انبار / تامین‌کننده</label>
                                            <SearchableSelect
                                                options={locationOptions}
                                                value={stockForm.compositeId}
                                                onChange={(val) => setStockForm({...stockForm, compositeId: val})}
                                                placeholder="جستجوی نام تامین‌کننده یا شهر یا کد..."
                                            />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">قیمت (تومان)</label>
                                            <input 
                                                type="text" 
                                                inputMode="numeric"
                                                dir="ltr"
                                                required 
                                                className="w-full p-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-left font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                                                value={stockForm.unitprice !== '' && stockForm.unitprice != null ? Number(stockForm.unitprice).toLocaleString() : ''} 
                                                onChange={e => {
                                                    const englishNum = toEnglishDigits(e.target.value);
                                                    const raw = englishNum.replace(/\D/g, '');
                                                    setStockForm({...stockForm, unitprice: raw});
                                                }} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">تعداد</label>
                                            <input type="number" required min="0" className="w-full p-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-left font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500" dir="ltr" value={stockForm.quantity} onChange={e => setStockForm({...stockForm, quantity: e.target.value})} />
                                        </div>
                                    </div>
                                    {stockError && <p className="text-red-500 text-xs mt-2">{stockError}</p>}
                                    <div className="flex justify-end mt-3">
                                        <button type="submit" disabled={isSubmittingStock} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-50 flex items-center gap-2">
                                            {isSubmittingStock && <div className="spinner !w-3 !h-3 !border-t-white"></div>}
                                            {isSubmittingStock ? 'در حال ثبت...' : 'ثبت موجودی'}
                                        </button>
                                    </div>
                                </form>
                            )}

                            <div className="space-y-2 max-h-60 overflow-y-auto pr-2">

        const GenericManager = ({ onSave, title, tableName, items: initialItems, confirmModal, onManageAttributes, attributeLabel }) => {
            const [items, setItems] = React.useState(initialItems);
            const [newItemName, setNewItemName] = React.useState('');
            const [editingItem, setEditingItem] = React.useState(null);
            const [isLoading, setIsLoading] = React.useState(false);
            const [error, setError] = React.useState('');

            React.useEffect(() => { setItems(initialItems); }, [initialItems]);

            const handleAddItem = async (e) => {
                e.preventDefault();
                if (!newItemName.trim()) return;
                setIsLoading(true);
                setError('');

                const { data, error } = await supabaseClient.from(tableName).insert({ title: newItemName.trim() }).select().single();
                if (error) {
                    setError(`خطا در افزودن: ${error.message}`);
                } else {
                    setItems(prev => [...prev, data]);
                    setNewItemName('');
                    onSave();
                }
                setIsLoading(false);
            };

            const handleUpdateItem = async () => {
                if (!editingItem || !editingItem.title.trim()) return;
                setIsLoading(true);
                setError('');

                const { error } = await supabaseClient.from(tableName).update({ title: editingItem.title.trim() }).eq('id', editingItem.id);
                if (error) {
                    setError(`خطا در به‌روزرسانی: ${error.message}`);
                } else {
                    setItems(prev => prev.map(item => item.id === editingItem.id ? editingItem : item));
                    setEditingItem(null);
                    onSave();
                }
                setIsLoading(false);
            };

            const requestDeleteItem = (item) => {
                confirmModal({
                    isOpen: true,
                    message: `آیا از حذف "${item.title}" اطمینان دارید؟ این عمل ممکن است باعث خطا در موارد مرتبط شود.`,
                    onConfirm: () => executeDeleteItem(item.id)
                });
            };

            const executeDeleteItem = async (itemId) => {
                setIsLoading(true);
                setError('');
                const { error } = await supabaseClient.from(tableName).delete().eq('id', itemId);
                if (error) {
                    setError(`خطا در حذف. ممکن است این مورد توسط آیتم دیگری استفاده شده باشد.`);
                } else {
                    setItems(prev => prev.filter(item => item.id !== itemId));
                    onSave();
                }
                setIsLoading(false);
            };
            
            return (
                <div className="space-y-4 bg-white dark:bg-gray-800 p-4 rounded-lg shadow border border-gray-200 dark:border-gray-700">
                    <h2 className="text-xl font-bold mb-4">{`لیست ${title}`}</h2>
                    <form onSubmit={handleAddItem} className="flex gap-2">
                        <input type="text" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} placeholder={`افزودن ${title} جدید...`} className="flex-grow bg-gray-100 dark:bg-gray-700 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        <button type="submit" disabled={isLoading} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg disabled:bg-green-400">افزودن</button>
                    </form>
                    {error && <p className="text-red-500 text-sm">{error}</p>}
                    <div className="max-h-96 overflow-y-auto space-y-2 pr-2">
                        {items.map(item => (
                            <div key={item.id} className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 p-2 bg-gray-50 dark:bg-gray-700/50 rounded-md border border-transparent dark:border-gray-600 hover:border-gray-200">
                                {editingItem?.id === item.id ? (
                                    <input type="text" value={editingItem.title} onChange={(e) => setEditingItem({ ...editingItem, title: e.target.value })} className="flex-grow bg-white dark:bg-gray-600 p-1 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-indigo-500" autoFocus onBlur={handleUpdateItem} onKeyDown={e => e.key === 'Enter' && handleUpdateItem()} />
                                ) : ( <span className="text-gray-800 dark:text-gray-200 font-medium">{item.title}</span> )}
                                <div className="flex-shrink-0 flex flex-wrap gap-x-2 gap-y-1 sm:space-x-reverse w-full sm:w-auto justify-end">
                                    {onManageAttributes && (<button onClick={() => onManageAttributes(item)} className="text-sm text-green-600 dark:text-green-400 hover:underline">{attributeLabel || 'مدیریت'}</button>)}
                                    {editingItem?.id === item.id ? (<button onClick={() => setEditingItem(null)} className="text-sm text-gray-500 hover:underline">لغو</button>) : (<button onClick={() => setEditingItem(item)} className="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">ویرایش</button>)}
                                    <button onClick={() => requestDeleteItem(item)} disabled={isLoading} className="text-sm text-red-500 hover:underline">حذف</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        const AssignAttributesModal = ({ isOpen, onClose, category, allAttributes, onSave }) => {
            const [selectedAttributes, setSelectedAttributes] = React.useState(new Set());
            const [isLoading, setIsLoading] = React.useState(true);

            React.useEffect(() => {
                if (isOpen) {
                    setIsLoading(true);
                    supabaseClient.from('category_propertykey').select('propertykey_id').eq('category_id', category.id)
                        .then(({ data, error }) => {
                            if(error) console.error(error);
                            else { setSelectedAttributes(new Set(data.map(item => item.propertykey_id))); }
                            setIsLoading(false);
                        });
                }
            }, [isOpen, category]);

            const handleToggle = (attributeId) => {
                setSelectedAttributes(prev => { const newSet = new Set(prev); if (newSet.has(attributeId)) { newSet.delete(attributeId); } else { newSet.add(attributeId); } return newSet; });
            };

            const handleSave = async () => {
                setIsLoading(true);
                await supabaseClient.from('category_propertykey').delete().eq('category_id', category.id);
                const toInsert = Array.from(selectedAttributes).map(propId => ({ category_id: category.id, propertykey_id: propId }));
                if (toInsert.length > 0) { await supabaseClient.from('category_propertykey').insert(toInsert); }
                onSave();
                onClose();
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`مدیریت ویژگی‌های دسته‌بندی: ${category?.title}`}>
                    {isLoading ? <div className="flex justify-center p-6"><div className="spinner !border-t-indigo-600"></div></div> : (
                        <div className="space-y-2 max-h-96 overflow-y-auto">
                            {allAttributes.map(attr => (
                                <label key={attr.id} className="flex items-center p-3 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer transition-colors border border-transparent dark:border-gray-700">
                                    <input type="checkbox" className="ml-3 h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" checked={selectedAttributes.has(attr.id)} onChange={() => handleToggle(attr.id)} />
                                    <span className="font-medium text-gray-800 dark:text-gray-200">{attr.title}</span>
                                </label>
                            ))}
                        </div>
                    )}
                    <div className="flex justify-end gap-3 pt-4 mt-4 border-t border-gray-200 dark:border-gray-600">
                        <button onClick={onClose} className="bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white py-2 px-4 rounded-lg">انصراف</button>
                        <button onClick={handleSave} disabled={isLoading} className="bg-indigo-600 text-white py-2 px-4 rounded-lg disabled:bg-indigo-400">ذخیره تغییرات</button>
                    </div>
                </Modal>
            );
        };
        
        const ProductManagerDashboard = ({ toggleTheme, theme }) => {

            const [searchTerm, setSearchTerm] = React.useState('');

            const [showNoSupplier, setShowNoSupplier] = React.useState(false);
            const [currentPage, setCurrentPage] = React.useState(1);
            const [totalProducts, setTotalProducts] = React.useState(0);
            const [sortConfig, setSortConfig] = React.useState({ key: 'id', direction: 'desc' });
            const [itemsPerPage, setItemsPerPage] = React.useState(15);

            const [isProductModalOpen, setIsProductModalOpen] = React.useState(false);
            const [editingProduct, setEditingProduct] = React.useState(null);
            const [isAssignModalOpen, setIsAssignModalOpen] = React.useState(false);
            const [selectedCategory, setSelectedCategory] = React.useState(null);
            const [confirmState, setConfirmState] = React.useState({ isOpen: false, onConfirm: null, message: '' });
            const [isDetailsModalOpen, setIsDetailsModalOpen] = React.useState(false);
            const [viewingProduct, setViewingProduct] = React.useState(null);

            const fetchBaseData = async () => {
                const [categoryRes, brandRes, propKeyRes] = await Promise.all([
                    supabaseClient.from('productcategory').select('*').order('title'),
                    supabaseClient.from('brand').select('*').order('title'),
                    supabaseClient.from('propertykey').select('*').order('title')
                ]);
                setAppData({ 
                    categories: categoryRes.data || [], 
                    brands: brandRes.data || [],
                    propertyKeys: propKeyRes.data || []
                });
            };

            const fetchProducts = React.useCallback(async () => {
                setIsLoading(true);
                
                let query = supabaseClient.from('product').select(`*, productcategory(id, title), brand(id, title), supplierstock(*, profiles:supplieruserid(fullname), location(id)), productproperty(*, propertykey(*))`, { count: 'exact' });
                
                if (searchTerm) {
                    let orConditions = [`title.ilike.%${searchTerm}%`];

                    if (!isNaN(searchTerm) && searchTerm.trim() !== '') {
                        orConditions.push(`id.eq.${parseInt(searchTerm.trim(), 10)}`);
                    }

                    if (appData.propertyKeys.length > 0) {
                        const telegramKeyId = appData.propertyKeys.find(p => p.title === 'کد کالا (تلگرام)')?.id;
                        if (telegramKeyId) {
                            const { data: matchingProperties } = await supabaseClient
                                .from('productproperty')
                                .select('productid')
                                .eq('propertykeyid', telegramKeyId)
                                .ilike('value', `%${searchTerm}%`);
                            
                            if (matchingProperties && matchingProperties.length > 0) {
                                const productIds = matchingProperties.map(p => p.productid);
                                orConditions.push(`id.in.(${productIds.join(',')})`);
                            }
                        }
                    }
                    
                    query = query.or(orConditions.join(','));
                }

                if (categoryFilter) { query = query.eq('productcategoryid', categoryFilter); }
                
                if (showNoSupplier) { 
                    const { data: stockedProductIds } = await supabaseClient.from('supplierstock').select('productid');
                    if (stockedProductIds && stockedProductIds.length > 0) {
                        const uniqueIds = [...new Set(stockedProductIds.map(s => s.productid))];
                        query = query.not('id', 'in', `(${uniqueIds.join(',')})`);
                    }
                }

                query = query.order(sortConfig.key, { ascending: sortConfig.direction === 'asc' });

                const from = (currentPage - 1) * itemsPerPage;
                const to = from + itemsPerPage - 1;
                query = query.range(from, to);

                const { data, error, count } = await query;
                
                if (error) { console.error("Error fetching products", error); } 
                else { setProducts(data || []); setTotalProducts(count || 0); }
                
                setIsLoading(false);
            }, [currentPage, sortConfig, searchTerm, categoryFilter, showNoSupplier, itemsPerPage, appData]);

            React.useEffect(() => { fetchBaseData(); }, []);
            React.useEffect(() => { if(activeTab === 'products') fetchProducts(); }, [fetchProducts, activeTab]);
            
            const handleSort = (key) => {
                setSortConfig(prev => ({
                    key,
                    direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                }));
                 setCurrentPage(1);

            const handleOpenProductModal = (product = null) => { setEditingProduct(product); setIsProductModalOpen(true); };
            const handleCloseProductModal = () => { setIsProductModalOpen(false); setEditingProduct(null); };
            
            const handleOpenDetailsModal = (product) => { setViewingProduct(product); setIsDetailsModalOpen(true); };
            const handleCloseDetailsModal = () => { setViewingProduct(null); setIsDetailsModalOpen(false); };

                const { data, error } = await supabaseClient

                    .eq('id', productId)

                    {children}
                </button>
            );
            
            const SortableHeader = ({ children, columnKey }) => {
                const isSorted = sortConfig.key === columnKey;

                return (
                    <th className="p-3 cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-colors" onClick={() => handleSort(columnKey)}>
                        {children} <span className="text-xs text-indigo-500 mr-1">{icon}</span>
                    </th>

            };

            return (

                                <svg xmlns="http://www.w3.org/2000/svg" className="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">داشبورد مدیریت محصولات</h1>
                                <p className="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">پورتال متمرکز تیم تامین و دسته‌بندی</p>
                            </div>
                        </div>
                        {activeTab === 'products' && (
                            <button onClick={() => handleOpenProductModal()} className="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-5 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clipRule="evenodd" /></svg>
                                تعریف محصول جدید
                            </button>
                        )}
                    </div>
                    
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 mb-6 overflow-hidden">

                                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                                          <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span>

                                            <thead className="bg-gray-50 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300">
                                                <tr className="border-b border-gray-200 dark:border-gray-700">
                                                    <th className="p-3 w-16 rounded-tr-lg">تصویر</th>
                                                    <SortableHeader columnKey="id">کد بازاریو</SortableHeader>
                                                    <SortableHeader columnKey="title">نام محصول</SortableHeader>
                                                    <th className="p-3">کد تلگرام</th>
                                                    <th className="p-3">دسته‌بندی</th>
                                                    <th className="p-3">برند</th>
                                                    <th className="p-3">وضعیت تامین</th>
                                                    <SortableHeader columnKey="createdat">تاریخ ثبت</SortableHeader>
                                                    <th className="p-3 rounded-tl-lg">عملیات</th>
                                                </tr>
                                            </thead>
                                            {isLoading ? <TableSkeleton /> : (
                                                <tbody className="divide-y divide-gray-200 dark:divide-gray-700/50">
                                                    {products.length === 0 ? (
                                                        <tr><td colSpan="9" className="text-center py-10 text-gray-500">محصولی با این فیلترها یافت نشد.</td></tr>
                                                    ) : (
                                                        products.map(product => {
                                                            const telegramCode = product.productproperty.find(p => p.propertykey?.title === 'کد کالا (تلگرام)')?.value || '-';
                                                            return (
                                                                <tr key={product.id} className="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">
                                                                    <td className="p-3">
                                                                        <div className="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-md overflow-hidden border border-gray-200 dark:border-gray-600 flex items-center justify-center">
                                                                            {product.image_url ? <img src={product.image_url} alt="" className="w-full h-full object-cover" /> : <span className="text-[10px] text-gray-400">ندارد</span>}
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-3 font-mono">{product.id}</td>
                                                                    <td className="p-3 font-semibold text-gray-800 dark:text-gray-200">{product.title}</td>
                                                                    <td className="p-3 font-mono text-gray-600 dark:text-gray-400">{telegramCode}</td>
                                                                    <td className="p-3 text-gray-700 dark:text-gray-300">{product.productcategory?.title || '-'}</td>
                                                                    <td className="p-3 text-gray-600 dark:text-gray-400">{product.brand?.title || '-'}</td>
                                                                    <td className="p-3">
                                                                        {product.supplierstock.length > 0 ? 
                                                                            <span className="px-2.5 py-1 text-xs rounded-md bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-300 font-medium">دارد ({product.supplierstock.length})</span> :
                                                                            <span className="px-2.5 py-1 text-xs rounded-md bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-300 font-medium">ندارد</span>
                                                                        }
                                                                    </td>
                                                                    <td className="p-3 font-mono text-gray-500 text-xs">{toJalaali(product.createdat)}</td>
                                                                    <td className="p-3">
                                                                        <div className="flex items-center gap-3">
                                                                            <button onClick={() => handleOpenDetailsModal(product)} className="text-green-600 dark:text-green-400 hover:text-green-800 dark:hover:text-green-300 font-semibold transition-colors">جزئیات</button>
                                                                            <button onClick={() => handleOpenProductModal(product)} className="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-semibold transition-colors">ویرایش</button>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })
                                                    )}
                                                </tbody>
                                            )}
                                        </table>
                                    </div>

                                    {/* Mobile Card View */}
                                    <div className="block md:hidden space-y-4">
                                        {isLoading ? (
                                            [...Array(5)].map((_, i) => <CardSkeleton key={i} />)
                                        ) : products.length === 0 ? (
                                            <p className="text-center p-6 bg-white dark:bg-gray-800 rounded-xl shadow-sm text-gray-500 border border-gray-200 dark:border-gray-700">محصولی یافت نشد.</p>
                                        ) : (
                                            products.map(product => (
                                                <ProductCard
                                                    key={product.id}
                                                    product={product}
                                                    onOpenDetails={() => handleOpenDetailsModal(product)}
                                                    onOpenEdit={() => handleOpenProductModal(product)}
                                                />
                                            ))
                                        )}
                                    </div>

                                    {/* Pagination */}
                                    <div className="flex flex-col sm:flex-row justify-between items-center mt-6 gap-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                                        <div className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                        <span>نمایش</span>
                                            <select 
                                                value={itemsPerPage} 
                                                onChange={e => {
                                                    setItemsPerPage(Number(e.target.value));
                                                    setCurrentPage(1);
                                                }}
                                                className="p-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md cursor-pointer focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                            >
                                                <option value="15">15</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                            <span>ردیف از {totalProducts} رکورد</span>
                                        </div>
                                        <Pagination currentPage={currentPage} totalPages={Math.ceil(totalProducts / itemsPerPage)} onPageChange={setCurrentPage} />
                                    </div>
                                </div>
                            )}

                            {activeTab === 'categories' && ( <div className="animate-toast-in"><GenericManager onSave={fetchBaseData} title="دسته‌بندی" tableName="productcategory" items={appData.categories} confirmModal={setConfirmState} onManageAttributes={handleManageAttributes} attributeLabel="مدیریت ویژگی‌ها"/></div> )}
                            {activeTab === 'brands' && ( <div className="animate-toast-in"><GenericManager onSave={fetchBaseData} title="برند" tableName="brand" items={appData.brands} confirmModal={setConfirmState}/></div> )}
                            {activeTab === 'attributes' && ( <div className="animate-toast-in"><GenericManager onSave={fetchBaseData} title="ویژگی" tableName="propertykey" items={appData.propertyKeys} confirmModal={setConfirmState}/></div> )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
             const [theme, setTheme] = React.useState('light');
             React.useEffect(() => { document.documentElement.className = theme; }, [theme]);
             const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

             return (
                 <ToastProvider>
                     <ProductManagerDashboard theme={theme} toggleTheme={toggleTheme} />
                 </ToastProvider>
             );
         };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
